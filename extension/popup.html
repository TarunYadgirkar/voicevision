<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VoiceVision</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <h1>Voice<span>Vision</span></h1>
    <button id="openSiteBtn" class="icon-btn" title="Open the VoiceVision website in a new tab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M9 7h8v8" />
      </svg>
    </button>
  </div>

  <button id="micBtn" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="2" width="6" height="11" rx="3" />
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
    </svg>
    <span id="micLabel">Speak a command</span>
  </button>

  <p id="transcript" aria-live="polite"></p>
  <p id="explanation" aria-live="polite"></p>

  <h2 class="group-title">Strength of what is on</h2>
  <div id="filters" class="filters"><span class="empty">Nothing is on yet</span></div>

  <div id="controls"></div>

  <p class="hint">Or say it: "I have red-green colorblindness", "make it dark", "I'm light sensitive", "reset to normal"</p>

  <script src="popup.js"></script>
</body>
</html>
